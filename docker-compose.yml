services:  
  postgres:
    image: postgres:17.4
    container_name: postgres_db
    environment:
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_DB=${PG_DATABASE}
    ports:
      - ${PG_PORT}:${PG_PORT}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PG_USER} -d ${PG_DATABASE}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4.0'
  
  backend:
    build: ./backend
    restart: always
    ports:
      - 8080:8080
    environment:
      - HOST=postgres
      - PORT_DB=${PG_PORT}
      - USERNAME=${PG_USER}
      - PASSWORD=${PG_PASSWORD}
      - DATABASE=${PG_DATABASE}
    dns:
      - 77.88.8.8
    depends_on:
      - postgres
      - migrations
    
  migrations:
    depends_on:
      - postgres
    build: ./backend
    command: "npm run automigrate"
    environment:
      - PORT_DB=${PG_PORT}
      - USERNAME=${PG_USER}
      - PASSWORD=${PG_PASSWORD}
      - DATABASE=${PG_DATABASE}

volumes:
  postgres: